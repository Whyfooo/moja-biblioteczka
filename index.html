<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moja Biblioteczka</title>
<!-- WERSJA 1.6 - sztywny limit półki -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0c09; --bg2: #1a1410; --bg3: #241c14;
    --wood-dark: #2a1f14; --wood-mid: #3d2b1a; --wood-light: #5c3d22; --wood-edge: #6b4a28;
    --gold: #c8a96e; --gold-dim: #7a6040;
    --text: #e8d4b8; --text-dim: #9a7a5a; --text-faint: #5a4a38;
    --accent: #d4885a; --read: #5a9a6a; --unread: #4a4a4a;
    --border: rgba(200,169,110,0.12);
    --shelf-w: 738px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); font-family: 'Crimson Pro', Georgia, serif; min-height: 100vh; overflow-x: hidden; }

  header {
    padding: 1.5rem 2rem 1rem; border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
  }
  .header-title { font-size: 1.8rem; font-weight: 600; color: var(--gold); letter-spacing: 0.02em; }
  .header-title span { color: var(--text-dim); font-weight: 400; font-size: 1rem; margin-left: 0.75rem; font-family: 'JetBrains Mono', monospace; }
  .header-actions { display: flex; gap: 0.75rem; align-items: center; }
  .btn {
    font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; padding: 0.4rem 0.9rem;
    border-radius: 3px; cursor: pointer; transition: all 0.15s;
    border: 1px solid var(--gold-dim); background: transparent; color: var(--gold); letter-spacing: 0.05em;
  }
  .btn:hover { background: rgba(200,169,110,0.08); border-color: var(--gold); }
  .btn-accent { border-color: var(--accent); color: var(--accent); }
  .btn-accent:hover { background: rgba(212,136,90,0.08); }

  .stats { display: flex; gap: 2rem; padding: 1rem 2rem; border-bottom: 1px solid var(--border); }
  .stat { text-align: left; }
  .stat-n { font-size: 1.4rem; font-weight: 600; color: var(--gold); font-family: 'JetBrains Mono', monospace; }
  .stat-l { font-size: 0.8rem; color: var(--text-dim); margin-top: 1px; }
  .version-tag { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--text-faint); padding: 0.25rem 2rem; border-bottom: 1px solid var(--border); letter-spacing: 0.06em; }

  .filters { padding: 0.75rem 2rem; display: flex; gap: 0.5rem; flex-wrap: wrap; border-bottom: 1px solid var(--border); }
  .filter-btn {
    font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; padding: 0.3rem 0.7rem;
    border-radius: 2px; border: 1px solid var(--text-faint); background: transparent;
    color: var(--text-dim); cursor: pointer; transition: all 0.15s; letter-spacing: 0.04em;
  }
  .filter-btn:hover, .filter-btn.active { border-color: var(--gold-dim); color: var(--gold); background: rgba(200,169,110,0.06); }

  main { padding: 1.5rem 2rem 4rem; }
  .bookcase-grid { display: flex; gap: 2rem; justify-content: center; flex-wrap: wrap; overflow-x: auto; padding-bottom: 1rem; }

  .bookcase {
    background: var(--wood-dark); border: 2px solid var(--wood-light); border-radius: 4px;
    padding: 10px; width: 760px; flex-shrink: 0;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6), inset 0 1px 0 rgba(200,169,110,0.05);
  }
  .bookcase-label { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--gold-dim); text-align: center; margin-bottom: 6px; letter-spacing: 0.1em; text-transform: uppercase; }

  .shelf {
    background: var(--wood-mid); border-bottom: 9px solid var(--wood-light);
    border-radius: 2px 2px 0 0; padding: 4px 4px 0; margin-bottom: 3px;
    min-height: 145px; display: flex; align-items: flex-end; gap: 1px; position: relative; overflow: hidden; width: 100%;
  }
  .shelf::after { content: ''; position: absolute; bottom: -9px; left: 0; right: 0; height: 9px; background: linear-gradient(to bottom, var(--wood-edge), var(--wood-light)); }
  .shelf-spacer { flex: 1; min-width: 4px; }

  /* DRAG & DROP — seria jako blok */
  .series-block {
    display: flex; align-items: flex-end; gap: 1px; flex-shrink: 0;
    cursor: grab; border-radius: 1px;
    transition: opacity 0.15s;
    position: relative;
  }
  .series-block:active { cursor: grabbing; }
  .series-block.dragging { opacity: 0.35; }
  .series-block.drag-over-left::before {
    content: ''; position: absolute; left: -3px; top: 0; bottom: 0; width: 3px;
    background: var(--accent); border-radius: 2px; z-index: 30;
  }
  .series-block.drag-over-right::after {
    content: ''; position: absolute; right: -3px; top: 0; bottom: 0; width: 3px;
    background: var(--accent); border-radius: 2px; z-index: 30;
  }

  .book {
    height: 130px; min-width: 7px; border-radius: 1px 1px 0 0;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    position: relative; transition: transform 0.12s ease; flex-shrink: 0;
    border-right: 1px solid rgba(0,0,0,0.3); border-top: 1px solid rgba(255,255,255,0.08);
  }
  .series-block:hover .book { transform: translateY(-5px); }
  .book:hover { transform: translateY(-8px) !important; z-index: 20; }
  .book.unread-dim { opacity: 0.6; }
  .book-spine-text {
    font-size: 9px; font-family: 'JetBrains Mono', monospace;
    writing-mode: vertical-rl; text-orientation: mixed; transform: rotate(180deg);
    white-space: nowrap; overflow: hidden; max-height: 124px;
    letter-spacing: 0.04em; padding: 0 1px; pointer-events: none;
  }

  /* DROP ZONE między seriami */
  .drop-zone {
    width: 6px; min-height: 130px; flex-shrink: 0; border-radius: 2px;
    transition: all 0.15s; opacity: 0;
  }
  .drop-zone.active { opacity: 1; background: rgba(212,136,90,0.25); width: 12px; }

  /* EDIT BAR */
  #edit-bar {
    display: none; background: rgba(212,136,90,0.08); border-bottom: 1px solid rgba(212,136,90,0.2);
    padding: 0.5rem 2rem; font-family: 'JetBrains Mono', monospace; font-size: 0.75rem;
    color: var(--accent); letter-spacing: 0.04em; align-items: center; gap: 1rem;
  }
  #edit-bar.active { display: flex; }

  /* SAVING INDICATOR */
  #save-indicator {
    position: fixed; bottom: 1.25rem; right: 1.5rem;
    background: var(--bg2); border: 1px solid var(--wood-light); border-radius: 4px;
    padding: 0.5rem 1rem; font-family: 'JetBrains Mono', monospace; font-size: 0.72rem;
    color: var(--text-dim); display: none; z-index: 200; transition: opacity 0.3s;
  }

  #loading { text-align: center; padding: 4rem; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; letter-spacing: 0.05em; }

  /* POPUP */
  .popup-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 1000; align-items: center; justify-content: center; padding: 1rem; }
  .popup-overlay.active { display: flex; }
  .popup { background: var(--bg2); border: 1px solid var(--wood-light); border-radius: 8px; padding: 0; max-width: 520px; width: 100%; position: relative; overflow: hidden; box-shadow: 0 24px 80px rgba(0,0,0,0.9); animation: popup-in 0.18s ease; display: block; }
  @keyframes popup-in { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .popup-close { position: absolute; top: 0.75rem; right: 0.9rem; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 50%; color: var(--text-dim); font-size: 1rem; cursor: pointer; line-height: 1; transition: all 0.1s; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; z-index: 10; }
  .popup-close:hover { color: var(--text); background: rgba(0,0,0,0.7); }
  .popup-cover-wrap { width: 100%; height: 300px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .popup-cover-bg { position: absolute; inset: 0; filter: blur(18px) brightness(0.4); background-size: cover; background-position: center; transform: scale(1.1); }
  .popup-cover { width: 160px; height: 240px; border-radius: 3px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; font-family: 'JetBrains Mono', monospace; text-align: center; padding: 8px; overflow: hidden; border: 2px solid rgba(255,255,255,0.15); position: relative; z-index: 2; box-shadow: 0 8px 32px rgba(0,0,0,0.6); }
  .popup-cover img { width: 100%; height: 100%; object-fit: cover; border-radius: 1px; }
  .popup-info { padding: 1.25rem 1.5rem 1.5rem; }
  .popup-series { font-size: 1.25rem; font-weight: 600; color: var(--text); margin-bottom: 3px; line-height: 1.3; font-family: 'Crimson Pro', serif; }
  .popup-vol { font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; color: var(--text-dim); margin-bottom: 0.9rem; }
  .popup-tags { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.9rem; }
  .tag { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; padding: 3px 8px; border-radius: 2px; letter-spacing: 0.04em; }
  .tag-manga { background: rgba(90,154,106,0.2); color: #88cc88; border: 1px solid rgba(90,154,106,0.3); }
  .tag-ln { background: rgba(90,110,180,0.2); color: #99aaee; border: 1px solid rgba(90,110,180,0.3); }
  .tag-manhwa { background: rgba(180,90,90,0.2); color: #ee9999; border: 1px solid rgba(180,90,90,0.3); }
  .tag-special { background: rgba(180,150,60,0.2); color: #ddcc77; border: 1px solid rgba(180,150,60,0.3); }
  .tag-lang { background: rgba(200,169,110,0.12); color: var(--gold); border: 1px solid rgba(200,169,110,0.2); }
  .popup-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.4rem; font-size: 0.95rem; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot-read { background: var(--read); box-shadow: 0 0 6px rgba(90,154,106,0.5); }
  .dot-unread { background: var(--unread); }
  .popup-pub { font-size: 0.8rem; color: var(--text-faint); margin-top: 0.6rem; font-style: italic; }

  /* LOGIN MODAL */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; align-items: center; justify-content: center; }
  .modal-overlay.active { display: flex; }
  .modal { background: var(--bg2); border: 1px solid var(--wood-light); border-radius: 6px; padding: 2rem; width: 300px; box-shadow: 0 20px 60px rgba(0,0,0,0.8); }
  .modal h2 { font-size: 1.2rem; color: var(--gold); margin-bottom: 1.25rem; font-weight: 600; }
  .modal input { width: 100%; background: var(--bg3); border: 1px solid var(--wood-light); border-radius: 3px; padding: 0.6rem 0.8rem; color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; margin-bottom: 0.75rem; outline: none; transition: border-color 0.15s; }
  .modal input:focus { border-color: var(--gold-dim); }
  .modal-error { font-size: 0.78rem; color: var(--accent); margin-bottom: 0.75rem; display: none; font-family: 'JetBrains Mono', monospace; }
  .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; }
</style>
</head>
<body>

<header>
  <div class="header-title">Biblioteczka <span id="header-count">ładowanie...</span></div>
  <div class="header-actions">
    <button class="btn" id="btn-login" onclick="showLogin()">Zaloguj</button>
    <button class="btn btn-accent" id="btn-admin" style="display:none" onclick="window.location.href='admin.html'">Panel admina</button>
    <button class="btn" id="btn-logout" style="display:none" onclick="doLogout()">Wyloguj</button>
  </div>
</header>

<div id="edit-bar">
  <span>● TRYB ADMINA</span>
  <span>Przeciągaj serie aby zmieniać kolejność — zapis automatyczny</span>
</div>

<div class="stats">
  <div class="stat"><div class="stat-n" id="stat-total">–</div><div class="stat-l">tomów</div></div>
  <div class="stat"><div class="stat-n" id="stat-read">–</div><div class="stat-l">przeczytanych</div></div>
  <div class="stat"><div class="stat-n" id="stat-series">–</div><div class="stat-l">serii</div></div>
</div>

<div class="version-tag">v1.6</div>
<div class="filters">
  <button class="filter-btn active" onclick="setFilter('all',this)">Wszystkie</button>
  <button class="filter-btn" onclick="setFilter('manga',this)">Manga</button>
  <button class="filter-btn" onclick="setFilter('light novel',this)">Light novel</button>
  <button class="filter-btn" onclick="setFilter('manhwa',this)">Manhwa</button>
  <button class="filter-btn" onclick="setFilter('special',this)">Wydania specjalne</button>
  <button class="filter-btn" onclick="setFilter('PL',this)">PL</button>
  <button class="filter-btn" onclick="setFilter('EN',this)">EN</button>
</div>

<main>
  <div id="loading">Ładowanie kolekcji...</div>
  <div class="bookcase-grid" id="bookcase-grid" style="display:none"></div>
</main>

<!-- POPUP -->
<div class="popup-overlay" id="popup-overlay" onclick="if(event.target===this)closePopup()">
  <div class="popup">
    <button class="popup-close" onclick="closePopup()">×</button>
    <div class="popup-cover-wrap" id="popup-cover-wrap">
      <div class="popup-cover-bg" id="popup-cover-bg"></div>
      <div class="popup-cover" id="popup-cover"></div>
    </div>
    <div class="popup-info">
      <div class="popup-series" id="popup-series"></div>
      <div class="popup-vol" id="popup-vol"></div>
      <div class="popup-tags" id="popup-tags"></div>
      <div class="popup-row"><div class="status-dot" id="popup-dot"></div><span id="popup-status"></span></div>
      <div class="popup-pub" id="popup-pub"></div>
    </div>
  </div>
</div>

<!-- LOGIN MODAL -->
<div class="modal-overlay" id="login-modal">
  <div class="modal">
    <h2>Logowanie</h2>
    <input type="email" id="login-email" placeholder="Email" autocomplete="email">
    <input type="password" id="login-pass" placeholder="Hasło" autocomplete="current-password">
    <div class="modal-error" id="login-error">Nieprawidłowy email lub hasło.</div>
    <div class="modal-actions">
      <button class="btn" onclick="hideLogin()">Anuluj</button>
      <button class="btn btn-accent" onclick="doLogin()">Wejdź</button>
    </div>
  </div>
</div>

<div id="save-indicator">Zapisywanie...</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs, doc, query, orderBy, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAae6a_mICUHIFBPecohVCVXWOm0xhZ9H0",
  authDomain: "moja-biblioteczka-baa77.firebaseapp.com",
  projectId: "moja-biblioteczka-baa77",
  storageBucket: "moja-biblioteczka-baa77.firebasestorage.app",
  messagingSenderId: "666967917363",
  appId: "1:666967917363:web:4ff51bf718fa2820b83446"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const SHELF_W = 724;
const CASES = 3;
const SHELVES_PER_CASE = 6;

let allSeries = [];
let allVolumes = [];
// orderByCases[c] = tablica ID serii przypisanych do regału c (0-indexed)
let orderByCases = [[], [], []];
let currentFilter = 'all';
let isAdmin = false;
let dragSrcId = null;
let dragSrcCase = null;
let saveTimeout = null;

// ---- AUTH ----
onAuthStateChanged(auth, user => {
  isAdmin = !!user;
  document.getElementById('btn-login').style.display = user ? 'none' : '';
  document.getElementById('btn-logout').style.display = user ? '' : 'none';
  document.getElementById('btn-admin').style.display = user ? '' : 'none';
  document.getElementById('edit-bar').classList.toggle('active', !!user);
  if(allSeries.length) renderAll();
});

window.showLogin = () => document.getElementById('login-modal').classList.add('active');
window.hideLogin = () => document.getElementById('login-modal').classList.remove('active');
window.doLogin = async () => {
  const email = document.getElementById('login-email').value;
  const pass = document.getElementById('login-pass').value;
  const err = document.getElementById('login-error');
  err.style.display = 'none';
  try { await signInWithEmailAndPassword(auth, email, pass); hideLogin(); }
  catch(e) { err.style.display = 'block'; }
};
window.doLogout = () => signOut(auth);
document.getElementById('login-pass').addEventListener('keydown', e => { if(e.key==='Enter') window.doLogin(); });

// ---- LOAD ----
async function loadData() {
  try {
    const [seriesSnap, volsSnap] = await Promise.all([
      getDocs(query(collection(db,'series'), orderBy('order','asc'))),
      getDocs(query(collection(db,'volumes'), orderBy('seriesId','asc')))
    ]);
    allSeries = seriesSnap.docs.map(d => ({id:d.id,...d.data()}));
    allVolumes = volsSnap.docs.map(d => ({id:d.id,...d.data()}));

    // Buduj orderByCases z pola bookcase każdej serii
    // Jeśli seria nie ma bookcase (stare dane), rozdziel równomiernie
    orderByCases = [[], [], []];
    allSeries.forEach(s => {
      const bc = (s.bookcase !== undefined && s.bookcase >= 0 && s.bookcase < CASES)
        ? s.bookcase
        : null;
      if(bc !== null) {
        orderByCases[bc].push(s.id);
      }
    });
    // Serie bez bookcase — dorzuć do najmniej załadowanego regału
    allSeries.forEach(s => {
      if(s.bookcase === undefined || s.bookcase < 0 || s.bookcase >= CASES) {
        const counts = orderByCases.map(arr => arr.length);
        const minCase = counts.indexOf(Math.min(...counts));
        orderByCases[minCase].push(s.id);
      }
    });

    renderAll();
  } catch(e) {
    document.getElementById('loading').textContent = 'Błąd ładowania. Sprawdź połączenie.';
    console.error(e);
  }
}

// ---- RENDER ----
function getFilteredSeriesIds() {
  if(currentFilter === 'all') return new Set(allSeries.map(s=>s.id));
  return new Set(allSeries.filter(s => {
    if(currentFilter==='PL'||currentFilter==='EN') return s.lang===currentFilter;
    return s.type===currentFilter;
  }).map(s=>s.id));
}

function renderAll() {
  const filteredIds = getFilteredSeriesIds();

  document.getElementById('stat-total').textContent = allVolumes.length;
  document.getElementById('stat-read').textContent = allVolumes.filter(v=>v.read).length;
  document.getElementById('stat-series').textContent = allSeries.length;
  document.getElementById('header-count').textContent = allVolumes.length + ' tomów';

  // Grupuj tomy per seria
  const volsBySeries = {};
  allVolumes.forEach(v => {
    if(!volsBySeries[v.seriesId]) volsBySeries[v.seriesId] = [];
    volsBySeries[v.seriesId].push(v);
  });
  Object.values(volsBySeries).forEach(arr => arr.sort((a,b)=>a.volNumber-b.volNumber));

  document.getElementById('loading').style.display = 'none';
  const grid = document.getElementById('bookcase-grid');
  grid.style.display = 'flex';
  grid.innerHTML = '';

  for(let c=0; c<CASES; c++) {
    const bc = document.createElement('div');
    bc.className = 'bookcase';
    bc.dataset.case = c;
    bc.innerHTML = `<div class="bookcase-label">Regał ${c+1}</div>`;

    // Pakuj serie tego regału na półki z zawijaniem
    const caseSeriesIds = orderByCases[c].filter(sid => filteredIds.has(sid));
    // shelves dla tego regału
    // Pakowanie: każdy tom osobno, sztywny limit SHELF_W
    // usedW[r] = ile px zajęte na półce r
    const usedW = new Array(SHELVES_PER_CASE).fill(0);
    // chunks[r] = [{sid, vols[]}]
    const shelfChunks = Array.from({length: SHELVES_PER_CASE}, () => []);

    let si = 0;
    caseSeriesIds.forEach(sid => {
      const s = allSeries.find(x=>x.id===sid);
      const vols = volsBySeries[sid]||[];
      if(!vols.length) return;

      vols.forEach(v => {
        const w = (v.width||(s?.type==='light novel'?13:9)) + 1;

        // Jeśli ten tom nie mieści się na obecnej półce — przejdź do następnej
        if(usedW[si] + w > SHELF_W) {
          if(si < SHELVES_PER_CASE - 1) si++;
        }

        // Dodaj tom — scal z ostatnim chunkiem tej serii na tej półce
        const chunks = shelfChunks[si];
        const last = chunks.length > 0 ? chunks[chunks.length - 1] : null;
        if(last && last.sid === sid) {
          last.vols.push(v);
        } else {
          chunks.push({sid, vols: [v]});
        }
        usedW[si] += w;
      });
    });

    // Przepisz do shelves żeby reszta kodu działała
    for(let r = 0; r < SHELVES_PER_CASE; r++) {
      shelves[r].chunks = shelfChunks[r];
      shelves[r].usedW = usedW[r];
    }

    for(let r=0; r<SHELVES_PER_CASE; r++) {
      const shelf = document.createElement('div');
      shelf.className = 'shelf';
      shelf.dataset.shelfCase = c;
      shelf.dataset.shelfRow = r;

      // Drop zone na początku półki (tylko admin)
      if(isAdmin) {
        shelf.appendChild(makeShelfDropZone(c, null, 'before-first'));
      }

      shelves[r].chunks.forEach(({sid, vols}) => {
        const s = allSeries.find(x=>x.id===sid);
        if(!s) return;

        const block = document.createElement('div');
        block.className = 'series-block';
        block.dataset.seriesId = sid;
        block.dataset.seriesCase = c;

        if(isAdmin) {
          block.draggable = true;
          block.addEventListener('dragstart', onDragStart);
          block.addEventListener('dragend', onDragEnd);
          block.addEventListener('dragover', onDragOver);
          block.addEventListener('dragleave', onDragLeave);
          block.addEventListener('drop', onDropOnSeries);
        }

        vols.forEach(v => {
          const w = v.width||(s.type==='light novel'?13:9);
          const el = document.createElement('div');
          el.className = 'book'+(v.read?'':' unread-dim');
          el.style.cssText = `width:${w}px;background:${s.spineColor};`;
          el.innerHTML = `<span class="book-spine-text" style="color:${s.spineTextColor||'#fff'}">${s.shortName||s.name} ${v.volNumber}</span>`;
          el.addEventListener('click', e => { e.stopPropagation(); openPopup(v,s); });
          block.appendChild(el);
        });

        shelf.appendChild(block);

        if(isAdmin) {
          shelf.appendChild(makeShelfDropZone(c, sid, 'after'));
        }
      });

      const sp = document.createElement('div'); sp.className = 'shelf-spacer'; shelf.appendChild(sp);
      bc.appendChild(shelf);
    }

    // Drop zone na cały regał (puste miejsce) — obsługa dropa na pusty regał
    if(isAdmin) {
      bc.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect='move'; });
      bc.addEventListener('drop', e => onDropOnCase(e, c));
    }

    grid.appendChild(bc);
  }
}

// ---- DROP ZONES ----
function makeShelfDropZone(caseIdx, afterSid, position) {
  const dz = document.createElement('div');
  dz.className = 'drop-zone';
  dz.dataset.dzCase = caseIdx;
  dz.dataset.dzAfter = afterSid || '';
  dz.dataset.dzPos = position;
  dz.addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation(); dz.classList.add('active'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('active'));
  dz.addEventListener('drop', e => { e.preventDefault(); e.stopPropagation(); dz.classList.remove('active'); performDrop(parseInt(dz.dataset.dzCase), dz.dataset.dzAfter||null, false); });
  return dz;
}

// ---- DRAG & DROP ----
function onDragStart(e) {
  dragSrcId = this.dataset.seriesId;
  dragSrcCase = parseInt(this.dataset.seriesCase);
  this.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragSrcId);
}

function onDragEnd(e) {
  this.classList.remove('dragging');
  document.querySelectorAll('.series-block').forEach(b => b.classList.remove('drag-over-left','drag-over-right'));
  document.querySelectorAll('.drop-zone').forEach(dz => dz.classList.remove('active'));
}

function onDragOver(e) {
  e.preventDefault(); e.stopPropagation();
  e.dataTransfer.dropEffect = 'move';
  if(this.dataset.seriesId === dragSrcId) return;
  const rect = this.getBoundingClientRect();
  this.classList.remove('drag-over-left','drag-over-right');
  this.classList.add(e.clientX < rect.left + rect.width/2 ? 'drag-over-left' : 'drag-over-right');
}

function onDragLeave(e) {
  this.classList.remove('drag-over-left','drag-over-right');
}

function onDropOnSeries(e) {
  e.preventDefault(); e.stopPropagation();
  const targetId = this.dataset.seriesId;
  const targetCase = parseInt(this.dataset.seriesCase);
  if(!targetId || targetId === dragSrcId) return;
  this.classList.remove('drag-over-left','drag-over-right');
  const rect = this.getBoundingClientRect();
  const insertAfter = e.clientX >= rect.left + rect.width/2;
  performDrop(targetCase, insertAfter ? targetId : getPrevSiblingId(targetCase, targetId), false);
}

function onDropOnCase(e, caseIdx) {
  // Upuść na pusty obszar regału — dorzuć na koniec
  if(e.target.closest('.series-block') || e.target.closest('.drop-zone')) return;
  performDrop(caseIdx, null, true);
}

function getPrevSiblingId(caseIdx, sid) {
  const arr = orderByCases[caseIdx];
  const idx = arr.indexOf(sid);
  return idx > 0 ? arr[idx-1] : null;
}

function performDrop(targetCase, afterSid, toEnd) {
  if(!dragSrcId) return;

  // Usuń z obecnego regału
  const srcArr = orderByCases[dragSrcCase];
  const srcIdx = srcArr.indexOf(dragSrcId);
  if(srcIdx === -1) return;
  srcArr.splice(srcIdx, 1);

  // Wstaw do docelowego regału
  const tgtArr = orderByCases[targetCase];
  if(toEnd || afterSid === null) {
    tgtArr.push(dragSrcId);
  } else {
    const afterIdx = tgtArr.indexOf(afterSid);
    tgtArr.splice(afterIdx+1, 0, dragSrcId);
  }

  dragSrcId = null;
  dragSrcCase = null;
  renderAll();
  scheduleSave();
}

// ---- ZAPIS ----
function scheduleSave() {
  const ind = document.getElementById('save-indicator');
  ind.textContent = 'Zapisywanie...'; ind.style.color = ''; ind.style.display = 'block';
  if(saveTimeout) clearTimeout(saveTimeout);
  saveTimeout = setTimeout(async () => {
    try {
      const batch = writeBatch(db);
      orderByCases.forEach((arr, caseIdx) => {
        arr.forEach((sid, idx) => {
          batch.update(doc(db,'series',sid), {bookcase: caseIdx, order: idx});
        });
      });
      await batch.commit();
      ind.textContent = 'Zapisano ✓'; ind.style.color = '#88cc88';
      setTimeout(() => { ind.style.display='none'; ind.style.color=''; }, 2000);
    } catch(err) {
      ind.textContent = 'Błąd zapisu!'; ind.style.color = 'var(--accent)';
      console.error(err);
    }
  }, 800);
}

// ---- POPUP ----
const typeTagClass = {manga:'tag-manga','light novel':'tag-ln',manhwa:'tag-manhwa',special:'tag-special'};
window.openPopup = function(v, s) {
  document.getElementById('popup-series').textContent = s.name;
  document.getElementById('popup-vol').textContent = `Tom ${v.volNumber}`;
  const tc = typeTagClass[s.type]||'tag-manga';
  document.getElementById('popup-tags').innerHTML = `<span class="tag ${tc}">${s.type}</span><span class="tag tag-lang">${s.lang}</span>`;
  document.getElementById('popup-dot').className = 'status-dot '+(v.read?'dot-read':'dot-unread');
  document.getElementById('popup-status').textContent = v.read?'Przeczytane':'Nieprzeczytane';
  document.getElementById('popup-status').style.color = v.read?'var(--read)':'var(--text-dim)';
  document.getElementById('popup-pub').textContent = s.publisher||'';

  const cover = document.getElementById('popup-cover');
  const coverBg = document.getElementById('popup-cover-bg');
  const coverWrap = document.getElementById('popup-cover-wrap');
  coverWrap.style.background = s.spineColor;
  coverBg.style.background = s.spineColor;
  if(v.coverUrl) {
    cover.innerHTML = `<img src="${v.coverUrl}" alt="Okładka ${s.name} tom ${v.volNumber}">`;
    coverBg.style.backgroundImage = `url('${v.coverUrl}')`;
    coverBg.style.background = '';
  } else {
    cover.style.background = s.spineColor;
    cover.style.color = s.spineTextColor||'#fff';
    cover.innerHTML = `<div style="font-size:9px;text-align:center;line-height:1.5">${s.name}<br><br>Tom ${v.volNumber}</div>`;
    coverBg.style.backgroundImage = '';
  }
  document.getElementById('popup-overlay').classList.add('active');
};
window.closePopup = () => document.getElementById('popup-overlay').classList.remove('active');

// ---- FILTERS ----
window.setFilter = function(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderAll();
};

loadData();
</script>
