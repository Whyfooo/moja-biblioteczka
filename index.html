<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moja Biblioteczka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0c09;
    --bg2: #1a1410;
    --bg3: #241c14;
    --wood-dark: #2a1f14;
    --wood-mid: #3d2b1a;
    --wood-light: #5c3d22;
    --wood-edge: #6b4a28;
    --gold: #c8a96e;
    --gold-dim: #7a6040;
    --text: #e8d4b8;
    --text-dim: #9a7a5a;
    --text-faint: #5a4a38;
    --accent: #d4885a;
    --read: #5a9a6a;
    --unread: #4a4a4a;
    --border: rgba(200,169,110,0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Crimson Pro', Georgia, serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  header {
    padding: 2rem 2rem 1rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .header-title {
    font-size: 1.8rem;
    font-weight: 600;
    color: var(--gold);
    letter-spacing: 0.02em;
  }
  .header-title span { color: var(--text-dim); font-weight: 400; font-size: 1rem; margin-left: 0.75rem; font-family: 'JetBrains Mono', monospace; }
  .header-actions { display: flex; gap: 0.75rem; align-items: center; }
  .btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    padding: 0.4rem 0.9rem;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.15s;
    border: 1px solid var(--gold-dim);
    background: transparent;
    color: var(--gold);
    letter-spacing: 0.05em;
  }
  .btn:hover { background: rgba(200,169,110,0.08); border-color: var(--gold); }
  .btn-accent { border-color: var(--accent); color: var(--accent); }
  .btn-accent:hover { background: rgba(212,136,90,0.08); }
  #btn-logout { display: none; }

  /* STATS */
  .stats {
    display: flex;
    gap: 2rem;
    padding: 1rem 2rem;
    border-bottom: 1px solid var(--border);
  }
  .stat { text-align: left; }
  .stat-n { font-size: 1.4rem; font-weight: 600; color: var(--gold); font-family: 'JetBrains Mono', monospace; }
  .stat-l { font-size: 0.8rem; color: var(--text-dim); margin-top: 1px; }

  /* FILTERS */
  .filters {
    padding: 0.75rem 2rem;
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }
  .filter-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    padding: 0.3rem 0.7rem;
    border-radius: 2px;
    border: 1px solid var(--text-faint);
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.04em;
  }
  .filter-btn:hover, .filter-btn.active {
    border-color: var(--gold-dim);
    color: var(--gold);
    background: rgba(200,169,110,0.06);
  }

  /* MAIN */
  main { padding: 1.5rem 2rem 4rem; }
  .bookcase-grid { display: flex; gap: 2rem; justify-content: center; flex-wrap: wrap; overflow-x: auto; padding-bottom: 1rem; }

  /* BOOKCASE */
  .bookcase {
    background: var(--wood-dark);
    border: 2px solid var(--wood-light);
    border-radius: 4px;
    padding: 10px;
    width: 760px;
    flex-shrink: 0;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6), inset 0 1px 0 rgba(200,169,110,0.05);
  }
  .bookcase-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    color: var(--gold-dim);
    text-align: center;
    margin-bottom: 6px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .shelf {
    background: var(--wood-mid);
    border-bottom: 9px solid var(--wood-light);
    border-radius: 2px 2px 0 0;
    padding: 4px 4px 0;
    margin-bottom: 3px;
    min-height: 58px;
    display: flex;
    align-items: flex-end;
    gap: 1px;
    position: relative;
  }
  .shelf::after {
    content: '';
    position: absolute;
    bottom: -7px;
    left: 0;
    right: 0;
    height: 7px;
    background: linear-gradient(to bottom, var(--wood-edge), var(--wood-light));
  }
  .shelf-spacer { flex: 1; min-width: 4px; }

  /* BOOKS */
  .book {
    height: 52px;
    min-width: 7px;
    border-radius: 1px 1px 0 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: transform 0.12s ease;
    flex-shrink: 0;
    border-right: 1px solid rgba(0,0,0,0.3);
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .book:hover { transform: translateY(-6px); z-index: 20; }
  .book.unread-dim { opacity: 0.6; }
  .book-spine-text {
    font-size: 7.5px;
    font-family: 'JetBrains Mono', monospace;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    transform: rotate(180deg);
    white-space: nowrap;
    overflow: hidden;
    max-height: 48px;
    letter-spacing: 0.03em;
    padding: 0 1px;
    pointer-events: none;
  }

  /* EMPTY SLOT (edit mode) */
  .book-slot {
    height: 40px;
    min-width: 10px;
    border: 1px dashed var(--text-faint);
    border-radius: 1px;
    cursor: pointer;
    flex-shrink: 0;
    opacity: 0.4;
    transition: opacity 0.15s;
  }
  .book-slot:hover { opacity: 0.8; }

  /* LOADING */
  #loading {
    text-align: center;
    padding: 4rem;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
  }

  /* POPUP */
  .popup-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .popup-overlay.active { display: flex; }
  .popup {
    background: var(--bg2);
    border: 1px solid var(--wood-light);
    border-radius: 6px;
    padding: 1.5rem;
    max-width: 360px;
    width: 100%;
    position: relative;
    display: flex;
    gap: 1.25rem;
    box-shadow: 0 20px 60px rgba(0,0,0,0.8);
    animation: popup-in 0.18s ease;
  }
  @keyframes popup-in { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .popup-close {
    position: absolute;
    top: 0.75rem;
    right: 0.9rem;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 1.2rem;
    cursor: pointer;
    line-height: 1;
    transition: color 0.1s;
  }
  .popup-close:hover { color: var(--text); }
  .popup-cover {
    width: 85px;
    height: 120px;
    border-radius: 2px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    font-family: 'JetBrains Mono', monospace;
    text-align: center;
    padding: 6px;
    overflow: hidden;
    border: 1px solid rgba(0,0,0,0.3);
  }
  .popup-cover img { width: 100%; height: 100%; object-fit: cover; border-radius: 1px; }
  .popup-info { flex: 1; min-width: 0; }
  .popup-series { font-size: 1.1rem; font-weight: 600; color: var(--text); margin-bottom: 2px; line-height: 1.3; }
  .popup-vol { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--text-dim); margin-bottom: 0.75rem; }
  .popup-tags { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
  .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    padding: 2px 7px;
    border-radius: 2px;
    letter-spacing: 0.04em;
  }
  .tag-manga { background: rgba(90,154,106,0.2); color: #88cc88; border: 1px solid rgba(90,154,106,0.3); }
  .tag-ln { background: rgba(90,110,180,0.2); color: #99aaee; border: 1px solid rgba(90,110,180,0.3); }
  .tag-manhwa { background: rgba(180,90,90,0.2); color: #ee9999; border: 1px solid rgba(180,90,90,0.3); }
  .tag-special { background: rgba(180,150,60,0.2); color: #ddcc77; border: 1px solid rgba(180,150,60,0.3); }
  .tag-lang { background: rgba(200,169,110,0.12); color: var(--gold); border: 1px solid rgba(200,169,110,0.2); }
  .popup-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.4rem; font-size: 0.9rem; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .dot-read { background: var(--read); }
  .dot-unread { background: var(--unread); }
  .popup-pub { font-size: 0.78rem; color: var(--text-faint); margin-top: 0.5rem; font-style: italic; }

  /* LOGIN MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 2000;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--bg2);
    border: 1px solid var(--wood-light);
    border-radius: 6px;
    padding: 2rem;
    width: 300px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.8);
  }
  .modal h2 { font-size: 1.2rem; color: var(--gold); margin-bottom: 1.25rem; font-weight: 600; }
  .modal input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--wood-light);
    border-radius: 3px;
    padding: 0.6rem 0.8rem;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    margin-bottom: 0.75rem;
    outline: none;
    transition: border-color 0.15s;
  }
  .modal input:focus { border-color: var(--gold-dim); }
  .modal-error { font-size: 0.78rem; color: var(--accent); margin-bottom: 0.75rem; display: none; font-family: 'JetBrains Mono', monospace; }
  .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; }

  /* EDIT MODE INDICATOR */
  #edit-bar {
    display: none;
    background: rgba(212,136,90,0.08);
    border-bottom: 1px solid rgba(212,136,90,0.2);
    padding: 0.5rem 2rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--accent);
    letter-spacing: 0.04em;
    align-items: center;
    gap: 1rem;
  }
  #edit-bar.active { display: flex; }
  #edit-bar span { opacity: 0.7; }

  /* RESPONSIVE */
  @media (max-width: 768px) {
    .bookcase { width: 100%; max-width: 760px; }
    main { padding: 1rem; }
    header { padding: 1rem; }
    .stats { padding: 0.75rem 1rem; gap: 1.25rem; }
    .filters { padding: 0.6rem 1rem; }
  }
</style>
</head>
<body>

<header>
  <div class="header-title">
    Biblioteczka
    <span id="header-count">ładowanie...</span>
  </div>
  <div class="header-actions">
    <button class="btn" id="btn-login" onclick="showLogin()">Zaloguj</button>
    <button class="btn btn-accent" id="btn-admin" style="display:none" onclick="window.location.href='admin.html'">Panel admina</button>
    <button class="btn" id="btn-logout" onclick="doLogout()">Wyloguj</button>
  </div>
</header>

<div id="edit-bar">
  <span>● TRYB ADMINA</span>
  <span>Kliknij tom aby edytować</span>
</div>

<div class="stats">
  <div class="stat"><div class="stat-n" id="stat-total">–</div><div class="stat-l">tomów</div></div>
  <div class="stat"><div class="stat-n" id="stat-read">–</div><div class="stat-l">przeczytanych</div></div>
  <div class="stat"><div class="stat-n" id="stat-series">–</div><div class="stat-l">serii</div></div>
</div>

<div class="filters">
  <button class="filter-btn active" onclick="setFilter('all',this)">Wszystkie</button>
  <button class="filter-btn" onclick="setFilter('manga',this)">Manga</button>
  <button class="filter-btn" onclick="setFilter('light novel',this)">Light novel</button>
  <button class="filter-btn" onclick="setFilter('manhwa',this)">Manhwa</button>
  <button class="filter-btn" onclick="setFilter('special',this)">Wydania specjalne</button>
  <button class="filter-btn" onclick="setFilter('PL',this)">PL</button>
  <button class="filter-btn" onclick="setFilter('EN',this)">EN</button>
</div>

<main>
  <div id="loading">Ładowanie kolekcji...</div>
  <div class="bookcase-grid" id="bookcase-grid" style="display:none"></div>
</main>

<!-- POPUP -->
<div class="popup-overlay" id="popup-overlay" onclick="if(event.target===this)closePopup()">
  <div class="popup">
    <button class="popup-close" onclick="closePopup()">×</button>
    <div class="popup-cover" id="popup-cover"></div>
    <div class="popup-info">
      <div class="popup-series" id="popup-series"></div>
      <div class="popup-vol" id="popup-vol"></div>
      <div class="popup-tags" id="popup-tags"></div>
      <div class="popup-row">
        <div class="status-dot" id="popup-dot"></div>
        <span id="popup-status"></span>
      </div>
      <div class="popup-pub" id="popup-pub"></div>
    </div>
  </div>
</div>

<!-- LOGIN MODAL -->
<div class="modal-overlay" id="login-modal">
  <div class="modal">
    <h2>Logowanie</h2>
    <input type="email" id="login-email" placeholder="Email" autocomplete="email">
    <input type="password" id="login-pass" placeholder="Hasło" autocomplete="current-password">
    <div class="modal-error" id="login-error">Nieprawidłowy email lub hasło.</div>
    <div class="modal-actions">
      <button class="btn" onclick="hideLogin()">Anuluj</button>
      <button class="btn btn-accent" onclick="doLogin()">Wejdź</button>
    </div>
  </div>
</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAae6a_mICUHIFBPecohVCVXWOm0xhZ9H0",
  authDomain: "moja-biblioteczka-baa77.firebaseapp.com",
  projectId: "moja-biblioteczka-baa77",
  storageBucket: "moja-biblioteczka-baa77.firebasestorage.app",
  messagingSenderId: "666967917363",
  appId: "1:666967917363:web:4ff51bf718fa2820b83446"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

// ---- STATE ----
let allSeries = [];
let allVolumes = [];
let currentFilter = 'all';
let isAdmin = false;

// ---- AUTH ----
onAuthStateChanged(auth, user => {
  isAdmin = !!user;
  document.getElementById('btn-login').style.display = user ? 'none' : '';
  document.getElementById('btn-logout').style.display = user ? '' : 'none';
  document.getElementById('btn-admin').style.display = user ? '' : 'none';
  document.getElementById('edit-bar').classList.toggle('active', !!user);
});

window.showLogin = () => document.getElementById('login-modal').classList.add('active');
window.hideLogin = () => document.getElementById('login-modal').classList.remove('active');

window.doLogin = async () => {
  const email = document.getElementById('login-email').value;
  const pass = document.getElementById('login-pass').value;
  const err = document.getElementById('login-error');
  err.style.display = 'none';
  try {
    await signInWithEmailAndPassword(auth, email, pass);
    hideLogin();
  } catch(e) {
    err.style.display = 'block';
  }
};

window.doLogout = () => signOut(auth);

// Enter key on login
document.getElementById('login-pass').addEventListener('keydown', e => { if(e.key==='Enter') window.doLogin(); });

// ---- LOAD DATA ----
async function loadData() {
  try {
    const [seriesSnap, volsSnap] = await Promise.all([
      getDocs(query(collection(db,'series'), orderBy('order','asc'))),
      getDocs(query(collection(db,'volumes'), orderBy('seriesId','asc')))
    ]);
    allSeries = seriesSnap.docs.map(d => ({id:d.id,...d.data()}));
    allVolumes = volsSnap.docs.map(d => ({id:d.id,...d.data()}));
    renderAll();
  } catch(e) {
    document.getElementById('loading').textContent = 'Błąd ładowania danych. Sprawdź połączenie.';
    console.error(e);
  }
}

// ---- RENDER ----
function renderAll() {
  const volumes = currentFilter === 'all'
    ? allVolumes
    : allVolumes.filter(v => {
        const s = allSeries.find(s=>s.id===v.seriesId);
        if(!s) return false;
        if(currentFilter==='PL'||currentFilter==='EN') return s.lang===currentFilter;
        return s.type===currentFilter;
      });

  // Stats
  const readCount = allVolumes.filter(v=>v.read).length;
  const uniqueSeries = new Set(allVolumes.map(v=>v.seriesId)).size;
  document.getElementById('stat-total').textContent = allVolumes.length;
  document.getElementById('stat-read').textContent = readCount;
  document.getElementById('stat-series').textContent = uniqueSeries;
  document.getElementById('header-count').textContent = allVolumes.length + ' tomów';

  // Pack volumes into shelves (3 cases × 6 shelves, 314px each)
  const SHELF_W = 738;
  const CASES = 3;
  const SHELVES_PER_CASE = 6;
  const TOTAL_SHELVES = CASES * SHELVES_PER_CASE;

  const shelves = Array.from({length: TOTAL_SHELVES}, () => ({items:[], usedW:0}));
  let si = 0;
  volumes.forEach(v => {
    const s = allSeries.find(s=>s.id===v.seriesId);
    if(!s) return;
    const w = v.width || (s.type==='light novel' ? 13 : 9);
    if(si >= TOTAL_SHELVES) return;
    if(shelves[si].usedW + w > SHELF_W && si < TOTAL_SHELVES-1) { si++; }
    shelves[si].items.push({v,s,w});
    shelves[si].usedW += w + 1;
  });

  // Render
  document.getElementById('loading').style.display = 'none';
  const grid = document.getElementById('bookcase-grid');
  grid.style.display = 'flex';
  grid.innerHTML = '';

  for(let c=0; c<CASES; c++) {
    const bc = document.createElement('div');
    bc.className = 'bookcase';
    bc.innerHTML = `<div class="bookcase-label">Regał ${c+1}</div>`;
    for(let r=0; r<SHELVES_PER_CASE; r++) {
      const si2 = c*SHELVES_PER_CASE + r;
      const shelf = document.createElement('div');
      shelf.className = 'shelf';
      shelves[si2].items.forEach(({v,s,w}) => {
        const el = document.createElement('div');
        el.className = 'book' + (v.read?'':' unread-dim');
        el.style.cssText = `width:${w}px;background:${s.spineColor};`;
        el.innerHTML = `<span class="book-spine-text" style="color:${s.spineTextColor||'#fff'}">${s.shortName||s.name} ${v.volNumber}</span>`;
        el.addEventListener('click', () => openPopup(v, s));
        shelf.appendChild(el);
      });
      const sp = document.createElement('div');
      sp.className = 'shelf-spacer';
      shelf.appendChild(sp);
      bc.appendChild(shelf);
    }
    grid.appendChild(bc);
  }
}

// ---- POPUP ----
const typeTagClass = {manga:'tag-manga','light novel':'tag-ln',manhwa:'tag-manhwa',special:'tag-special'};
window.openPopup = function(v, s) {
  document.getElementById('popup-series').textContent = s.name;
  document.getElementById('popup-vol').textContent = `Tom ${v.volNumber}`;

  const tags = document.getElementById('popup-tags');
  const tc = typeTagClass[s.type]||'tag-manga';
  tags.innerHTML = `<span class="tag ${tc}">${s.type}</span><span class="tag tag-lang">${s.lang}</span>`;

  document.getElementById('popup-dot').className = 'status-dot ' + (v.read?'dot-read':'dot-unread');
  document.getElementById('popup-status').textContent = v.read ? 'Przeczytane' : 'Nieprzeczytane';
  document.getElementById('popup-status').style.color = v.read ? 'var(--read)' : 'var(--text-dim)';
  document.getElementById('popup-pub').textContent = s.publisher || '';

  const cover = document.getElementById('popup-cover');
  cover.style.background = s.spineColor;
  if(v.coverUrl) {
    cover.innerHTML = `<img src="${v.coverUrl}" alt="Okładka ${s.name} tom ${v.volNumber}">`;
  } else {
    cover.style.color = s.spineTextColor || '#fff';
    cover.innerHTML = `<div style="font-size:8px;text-align:center">${s.name}<br><br>Tom ${v.volNumber}</div>`;
  }

  document.getElementById('popup-overlay').classList.add('active');
};
window.closePopup = () => document.getElementById('popup-overlay').classList.remove('active');

// ---- FILTERS ----
window.setFilter = function(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderAll();
};

// ---- INIT ----
loadData();
</script>
</body>
</html>
